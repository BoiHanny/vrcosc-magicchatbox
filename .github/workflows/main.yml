name: Build and Release

on:
  push:
    branches:
      - 'Pre-Master'
      - 'master'
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  SOLUTION_PATH: vrcosc-magicchatbox.sln
  PROJECT_PATH: vrcosc-magicchatbox\MagicChatbox.csproj

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
    - name: Check out the repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0

    - name: Set up the .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'

    # ---- Version and release tag ----
    - name: Read the version from the project file
      shell: pwsh
      run: |
        $csproj = "${{ env.PROJECT_PATH }}"
        $pattern = '<Version>(.*)</Version>'
        $content = Get-Content $csproj -Raw
        $match = [regex]::Match($content, $pattern)
        if ($match.Success -and $match.Groups.Count -gt 1) {
          $version = $match.Groups[1].Value
          echo "VERSION=$version" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
        }
        else {
          Write-Error "Error: Version not found in csproj file."
          exit 1
        }

    - name: Resolve the release tag
      id: resolve_release
      shell: pwsh
      run: |
        $csprojVersion = $env:VERSION
        $isTagRelease = $env:GITHUB_REF -like 'refs/tags/*'

        if ($isTagRelease) {
          $releaseTag = $env:GITHUB_REF_NAME

          if (-not $releaseTag.StartsWith('v')) {
            Write-Error "Release tags must start with 'v'. Found '$releaseTag'."
            exit 1
          }

          $tagVersion = $releaseTag.Substring(1)
          if ($tagVersion -ne $csprojVersion) {
            Write-Error "Tag version '$tagVersion' does not match csproj version '$csprojVersion'."
            exit 1
          }
        }
        else {
          $releaseTag = "v$csprojVersion"
        }

        "RELEASE_TAG=$releaseTag" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
        "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "is_tag_release=$($isTagRelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Check whether the release already exists
      id: check_release
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        retries: 3
        retry-exempt-status-codes: 400,401,404,422
        script: |
          const tag = `${{ steps.resolve_release.outputs.release_tag }}`;
          try {
            await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tag
            });
            core.setOutput('release_exists', 'true');
          } catch (error) {
            if (error.status === 404) {
              core.setOutput('release_exists', 'false');
            } else {
              throw error;
            }
          }

    - name: Create the release tag
      if: steps.resolve_release.outputs.is_tag_release != 'true' && steps.check_release.outputs.release_exists == 'false'
      id: ensure_tag_actions
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{ github.token }}
        retries: 3
        retry-exempt-status-codes: 400,401,404,422
        script: |
          const tag = `${{ steps.resolve_release.outputs.release_tag }}`;
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          try {
            await github.rest.git.getRef({
              owner,
              repo,
              ref: `tags/${tag}`
            });
            core.setOutput('tag_ready', 'true');
            core.setOutput('tag_source', 'existing');
          } catch (error) {
            if (error.status !== 404) {
              core.setOutput('tag_ready', 'false');
              core.setOutput('failure_message', `Failed checking tag ${tag} with github.token: ${error.message}`);
              return;
            }

            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha
              });
              core.setOutput('tag_ready', 'true');
              core.setOutput('tag_source', 'created-actions-token');
            } catch (createError) {
              core.setOutput('tag_ready', 'false');
              core.setOutput('failure_message', `Failed creating tag ${tag} with github.token: ${createError.message}`);
            }
          }

    - name: Create the release tag (fallback token)
      if: steps.resolve_release.outputs.is_tag_release != 'true' && steps.check_release.outputs.release_exists == 'false' && steps.ensure_tag_actions.outputs.tag_ready != 'true'
      id: ensure_tag_pat
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{ secrets.MY_PAT }}
        retries: 3
        retry-exempt-status-codes: 400,401,404,422
        script: |
          const tag = `${{ steps.resolve_release.outputs.release_tag }}`;
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          try {
            await github.rest.git.getRef({
              owner,
              repo,
              ref: `tags/${tag}`
            });
            core.setOutput('tag_ready', 'true');
            core.setOutput('tag_source', 'existing');
          } catch (error) {
            if (error.status !== 404) {
              core.setOutput('tag_ready', 'false');
              core.setOutput('failure_message', `Failed checking tag ${tag} with MY_PAT: ${error.message}`);
              return;
            }

            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha
              });
              core.setOutput('tag_ready', 'true');
              core.setOutput('tag_source', 'created-my-pat');
            } catch (createError) {
              core.setOutput('tag_ready', 'false');
              core.setOutput('failure_message', `Failed creating tag ${tag} with MY_PAT: ${createError.message}`);
            }
          }

    - name: Decide whether this branch run publishes
      if: steps.resolve_release.outputs.is_tag_release != 'true' && steps.check_release.outputs.release_exists == 'false'
      id: finalize_branch_release
      env:
        PRIMARY_READY: ${{ steps.ensure_tag_actions.outputs.tag_ready }}
        PRIMARY_SOURCE: ${{ steps.ensure_tag_actions.outputs.tag_source }}
        PRIMARY_FAILURE: ${{ steps.ensure_tag_actions.outputs.failure_message }}
        FALLBACK_READY: ${{ steps.ensure_tag_pat.outputs.tag_ready }}
        FALLBACK_SOURCE: ${{ steps.ensure_tag_pat.outputs.tag_source }}
        FALLBACK_FAILURE: ${{ steps.ensure_tag_pat.outputs.failure_message }}
      shell: pwsh
      run: |
        $primaryReady = $env:PRIMARY_READY
        $primarySource = $env:PRIMARY_SOURCE
        $fallbackReady = $env:FALLBACK_READY
        $fallbackSource = $env:FALLBACK_SOURCE
        $primaryFailure = $env:PRIMARY_FAILURE
        $fallbackFailure = $env:FALLBACK_FAILURE

        if ($primaryReady -ne 'true' -and $fallbackReady -ne 'true') {
          $failures = @()

          if (-not [string]::IsNullOrWhiteSpace($primaryFailure.Trim())) {
            $failures += $primaryFailure.Trim()
          }

          if (-not [string]::IsNullOrWhiteSpace($fallbackFailure.Trim())) {
            $failures += $fallbackFailure.Trim()
          }

          $details = if ($failures.Count -gt 0) { $failures -join ' || ' } else { "No additional error details were returned." }
          Write-Error "Unable to ensure release tag $env:RELEASE_TAG for this branch push. $details"
          exit 1
        }

        $tagSource = if ($primaryReady -eq 'true') { $primarySource } else { $fallbackSource }
        $publishNow = if ($tagSource -like 'created-*') { 'false' } else { 'true' }

        "tag_source=$tagSource" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "publish_now=$publishNow" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Stop early, the release already exists
      if: steps.resolve_release.outputs.is_tag_release == 'true' && steps.check_release.outputs.release_exists == 'true'
      run: |
        echo "Release ${{ steps.resolve_release.outputs.release_tag }} already exists. Skipping tagged release."
        exit 0

    # ---- Build ----
    - name: Restore dependencies
      if: steps.resolve_release.outputs.is_tag_release != 'true' || steps.check_release.outputs.release_exists == 'false'
      run: dotnet restore ${{ env.SOLUTION_PATH }} -r win-x64 -p:Configuration=Release

    - name: Publish the application
      if: steps.resolve_release.outputs.is_tag_release != 'true' || steps.check_release.outputs.release_exists == 'false'
      id: publish_app
      env:
        VOICEMOD_CLIENT_KEY: ${{ secrets.VOICEMOD_CLIENT_KEY }}
      shell: pwsh
      run: |
        $keyMissing = [string]::IsNullOrWhiteSpace($env:VOICEMOD_CLIENT_KEY)
        $isTagRelease = '${{ steps.resolve_release.outputs.is_tag_release }}' -eq 'true'
        $isRealRelease = $isTagRelease -or ($env:GITHUB_REF -eq 'refs/heads/master')

        if ($keyMissing -and $isRealRelease) {
          Write-Error "The VOICEMOD_CLIENT_KEY repository secret is required for tag and master release builds."
          exit 1
        }

        if ($keyMissing) {
          $warningMessage = "VOICEMOD_CLIENT_KEY is not set. This build will ship without an embedded Voicemod client key; users will need to supply their own in Options."
          Write-Warning $warningMessage
          Write-Host "::warning::$warningMessage"
        }

        $publishDir = Join-Path $env:GITHUB_WORKSPACE 'publish-output'
        if (Test-Path -LiteralPath $publishDir) {
          Remove-Item -LiteralPath $publishDir -Recurse -Force
        }

        $publishArgs = @(
          "${{ env.PROJECT_PATH }}",
          '--configuration',
          'Release',
          '--runtime',
          'win-x64',
          '--self-contained',
          'false',
          '--no-restore',
          '--output',
          $publishDir
        )

        if (-not $keyMissing) {
          # Kept as a single array element so PowerShell hands dotnet.exe one argv entry;
          # MSBuild special characters in the key (; % $ *) would still need %3B-style
          # escaping if a future key ever contains them, since MSBuild parses -p: values itself.
          $publishArgs += "-p:VoicemodClientKey=$env:VOICEMOD_CLIENT_KEY"
        }

        "key_embedded=$((-not $keyMissing).ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

        dotnet publish @publishArgs

    - name: Verify the embedded Voicemod client key
      if: (steps.resolve_release.outputs.is_tag_release != 'true' || steps.check_release.outputs.release_exists == 'false') && steps.publish_app.outputs.key_embedded == 'true'
      env:
        VOICEMOD_CLIENT_KEY: ${{ secrets.VOICEMOD_CLIENT_KEY }}
      shell: pwsh
      run: |
        Add-Type -AssemblyName System.Reflection.Metadata

        $publishDir = Join-Path $env:GITHUB_WORKSPACE 'publish-output'
        $dllPath = Join-Path $publishDir 'MagicChatbox.dll'

        if (-not (Test-Path -LiteralPath $dllPath)) {
          Write-Error "Published assembly not found: $dllPath"
          exit 1
        }

        $expectedLength = $env:VOICEMOD_CLIENT_KEY.Length
        $foundValue = $null

        $fs = [System.IO.File]::OpenRead($dllPath)
        try {
          $peReader = New-Object System.Reflection.PortableExecutable.PEReader($fs)
          try {
            $mdReader = [System.Reflection.Metadata.PEReaderExtensions]::GetMetadataReader($peReader)
            $asmDef = $mdReader.GetAssemblyDefinition()

            foreach ($caHandle in $asmDef.GetCustomAttributes()) {
              $ca = $mdReader.GetCustomAttribute($caHandle)
              $ctorHandle = $ca.Constructor
              $typeName = $null

              if ($ctorHandle.Kind -eq [System.Reflection.Metadata.HandleKind]::MemberReference) {
                $memberRef = $mdReader.GetMemberReference([System.Reflection.Metadata.MemberReferenceHandle]$ctorHandle)
                $parent = $memberRef.Parent
                if ($parent.Kind -eq [System.Reflection.Metadata.HandleKind]::TypeReference) {
                  $typeRef = $mdReader.GetTypeReference([System.Reflection.Metadata.TypeReferenceHandle]$parent)
                  $typeName = $mdReader.GetString($typeRef.Name)
                }
              }
              elseif ($ctorHandle.Kind -eq [System.Reflection.Metadata.HandleKind]::MethodDefinition) {
                $methodDef = $mdReader.GetMethodDefinition([System.Reflection.Metadata.MethodDefinitionHandle]$ctorHandle)
                $typeDef = $mdReader.GetTypeDefinition($methodDef.GetDeclaringType())
                $typeName = $mdReader.GetString($typeDef.Name)
              }

              if ($typeName -ne 'AssemblyMetadataAttribute') {
                continue
              }

              $blobReader = $mdReader.GetBlobReader($ca.Value)
              $prolog = $blobReader.ReadUInt16()
              if ($prolog -ne 1) {
                continue
              }

              $attrKey = $blobReader.ReadSerializedString()
              $attrValue = $blobReader.ReadSerializedString()

              if ($attrKey -eq 'VoicemodClientKey') {
                $foundValue = $attrValue
                break
              }
            }
          }
          finally {
            $peReader.Dispose()
          }
        }
        finally {
          $fs.Dispose()
        }

        if ([string]::IsNullOrEmpty($foundValue)) {
          Write-Error "AssemblyMetadataAttribute 'VoicemodClientKey' was not found (or was empty) in the published MagicChatbox.dll."
          exit 1
        }

        if ($foundValue.Length -ne $expectedLength) {
          Write-Error "Embedded Voicemod client key length ($($foundValue.Length)) does not match the source secret length ($expectedLength)."
          exit 1
        }

        Write-Host "Embedded Voicemod client key verified: found $($foundValue.Length) characters."

    - name: Verify the published launcher
      if: steps.resolve_release.outputs.is_tag_release != 'true' || steps.check_release.outputs.release_exists == 'false'
      shell: pwsh
      run: |
        $publishDir = Join-Path $env:GITHUB_WORKSPACE 'publish-output'
        $exePath = Join-Path $publishDir 'MagicChatbox.exe'

        if (-not (Test-Path -LiteralPath $exePath)) {
          Write-Error "Published launcher not found: $exePath"
          exit 1
        }

        $bytes = [System.IO.File]::ReadAllBytes($exePath)
        $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
        $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
        $magic = [BitConverter]::ToUInt16($bytes, $peOffset + 24)
        $dataDirectories = $peOffset + 24 + $(if ($magic -eq 0x20B) { 112 } else { 96 })
        $clrHeaderRva = [BitConverter]::ToUInt32($bytes, $dataDirectories + 14 * 8)

        # The stock .NET apphost is a native x64 PE with no CLR header and no side-car .config.
        # Anything else means a launcher stub replaced it after publish, which changes what
        # ships to users without changing a line of our own code.
        if ($machine -ne 0x8664) {
          Write-Error "MagicChatbox.exe reports machine 0x$('{0:X4}' -f $machine) instead of x64 (0x8664)."
          exit 1
        }

        if ($clrHeaderRva -ne 0) {
          Write-Error "MagicChatbox.exe carries a CLR header, so it is a managed launcher stub rather than the .NET apphost."
          exit 1
        }

        if (Test-Path -LiteralPath (Join-Path $publishDir 'MagicChatbox.exe.config')) {
          Write-Error "MagicChatbox.exe.config was published. The .NET apphost does not use one."
          exit 1
        }

        $strays = Get-ChildItem -LiteralPath $publishDir -Recurse -File -Include '*.pdb', 'MonoPosixHelper.dll', 'libMonoPosixHelper.dll'
        if ($strays) {
          Write-Error "Files that should never ship were published: $(($strays | ForEach-Object { $_.Name }) -join ', ')"
          exit 1
        }

        Write-Host "Published launcher verified: native x64 .NET apphost, $($bytes.Length) bytes."

    - name: Package the release archive
      if: steps.resolve_release.outputs.is_tag_release != 'true' || steps.check_release.outputs.release_exists == 'false'
      shell: pwsh
      run: |
        $publishDir = Join-Path $env:GITHUB_WORKSPACE 'publish-output'
        $archiveSource = Join-Path $publishDir '*'

        if (-not (Test-Path -LiteralPath $publishDir)) {
          Write-Error "Publish output directory not found: $publishDir"
          exit 1
        }

        Compress-Archive -Path $archiveSource -DestinationPath "MagicChatbox-${{ env.VERSION }}.zip" -Force

    - name: Hand off to the tag-triggered run
      if: steps.resolve_release.outputs.is_tag_release != 'true' && steps.check_release.outputs.release_exists == 'false' && steps.finalize_branch_release.outputs.publish_now != 'true'
      run: echo "Created release tag ${{ steps.resolve_release.outputs.release_tag }} during the branch run. The tag-triggered workflow run will publish the release."

    # ---- Malware scan ----
    - name: Scan the published output with Microsoft Defender
      if: steps.check_release.outputs.release_exists == 'false' && (steps.resolve_release.outputs.is_tag_release == 'true' || steps.finalize_branch_release.outputs.publish_now == 'true')
      continue-on-error: true
      shell: pwsh
      run: |
        $publishDir = Join-Path $env:GITHUB_WORKSPACE 'publish-output'

        # The copy under Program Files is the stale inbox build. The Platform directory holds the
        # engine that is actually running, and its version is the number worth recording.
        $platform = Get-ChildItem 'C:\ProgramData\Microsoft\Windows Defender\Platform' -Directory -ErrorAction SilentlyContinue |
          Sort-Object Name -Descending |
          Select-Object -First 1

        $mpCmdRun = if ($platform) { Join-Path $platform.FullName 'MpCmdRun.exe' } else { 'C:\Program Files\Windows Defender\MpCmdRun.exe' }

        if (-not (Test-Path -LiteralPath $mpCmdRun)) {
          Write-Host "::warning::MpCmdRun.exe was not found on this runner. Skipping the Defender check."
          exit 0
        }

        try {
          $status = Get-MpComputerStatus -ErrorAction Stop
          Write-Host "Defender engine $($status.AMEngineVersion), security intelligence $($status.AntivirusSignatureVersion)."
        }
        catch {
          Write-Host "::warning::Defender status is unavailable on this runner."
        }

        & $mpCmdRun -Scan -ScanType 3 -File $publishDir -DisableRemediation
        $scanExit = $LASTEXITCODE

        # Reports whether the launcher is already a known good file. It will not be until a
        # consistent publisher identity has had time to accumulate reputation.
        & $mpCmdRun -TrustCheck -File (Join-Path $publishDir 'MagicChatbox.exe')

        # Instrumentation, not a gate: runner definition state varies by image, and a stale-model
        # false alarm must never be able to block a release on its own.
        if ($scanExit -ne 0) {
          Write-Host "::warning::Microsoft Defender reported a detection in publish-output (exit code $scanExit)."
        }

    - name: Check for a VirusTotal credential
      if: steps.check_release.outputs.release_exists == 'false' && (steps.resolve_release.outputs.is_tag_release == 'true' || steps.finalize_branch_release.outputs.publish_now == 'true')
      id: optional_secrets
      env:
        VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      shell: pwsh
      run: |
        $hasVirusTotalKey = -not [string]::IsNullOrWhiteSpace($env:VIRUSTOTAL_API_KEY)
        "has_virustotal_key=$($hasVirusTotalKey.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Submit the archive to VirusTotal
      if: steps.check_release.outputs.release_exists == 'false' && (steps.resolve_release.outputs.is_tag_release == 'true' || steps.finalize_branch_release.outputs.publish_now == 'true') && steps.optional_secrets.outputs.has_virustotal_key == 'true'
      id: virustotal_scan
      env:
        VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      shell: pwsh
      run: |
        $filePath = Join-Path $env:GITHUB_WORKSPACE "MagicChatbox-${{ env.VERSION }}.zip"
        $apiKey = $env:VIRUSTOTAL_API_KEY

        if (-not (Test-Path -LiteralPath $filePath)) {
          Write-Error "File not found: $filePath"
          exit 1
        }

        $fileInfo = Get-Item $filePath

        if ($fileInfo.Length -gt 32MB) {
          Write-Error "VirusTotal standard upload only supports files up to 32 MB. Use /files/upload_url for larger files."
          exit 1
        }

        function Invoke-VirusTotalRequest {
          param([scriptblock]$Request, [int]$MaxAttempts = 4)

          for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
            try {
              return & $Request
            }
            catch {
              $statusCode = $_.Exception.Response.StatusCode.value__
              $retryable = $statusCode -eq 429 -or $statusCode -ge 500
              if (-not $retryable -or $attempt -eq $MaxAttempts) {
                throw
              }
              $delay = 5 * [math]::Pow(2, $attempt - 1)
              Write-Host "VirusTotal upload failed (status $statusCode), attempt $attempt/$MaxAttempts. Retrying in ${delay}s..."
              Start-Sleep -Seconds $delay
            }
          }
        }

        $response = Invoke-VirusTotalRequest -Request {
          Invoke-RestMethod `
            -Uri "https://www.virustotal.com/api/v3/files" `
            -Method Post `
            -Headers @{
              "x-apikey" = $apiKey
            } `
            -Form @{
              "file" = $fileInfo
            } `
            -TimeoutSec 120
        }

        $analysisId = $response.data.id
        "scan_id=$analysisId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Wait for the VirusTotal report
      if: steps.check_release.outputs.release_exists == 'false' && (steps.resolve_release.outputs.is_tag_release == 'true' || steps.finalize_branch_release.outputs.publish_now == 'true') && steps.optional_secrets.outputs.has_virustotal_key == 'true'
      id: virustotal_report
      env:
        VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      shell: pwsh
      run: |
        $apiKey = $env:VIRUSTOTAL_API_KEY
        $analysisId = "${{ steps.virustotal_scan.outputs.scan_id }}"

        if ([string]::IsNullOrWhiteSpace($analysisId)) {
          Write-Error "No VirusTotal analysis ID was returned."
          exit 1
        }

        # VirusTotal's public API allows ~4 req/min; 20s spacing keeps this loop under that with margin.
        $maxAttempts = 15
        $delaySeconds = 20
        $sha256 = $null

        for ($i = 1; $i -le $maxAttempts; $i++) {
          Write-Host "Checking VirusTotal analysis status (attempt $i/$maxAttempts)..."

          try {
            $response = Invoke-RestMethod `
              -Uri "https://www.virustotal.com/api/v3/analyses/$analysisId" `
              -Method Get `
              -Headers @{
                "x-apikey" = $apiKey
              } `
              -TimeoutSec 500

            $status = $response.data.attributes.status
            $sha256 = $response.meta.file_info.sha256

            if ($status -eq "completed" -and -not [string]::IsNullOrWhiteSpace($sha256)) {
              Write-Host "VirusTotal analysis completed. SHA256: $sha256"
              break
            }

            Write-Host "Status: $status — waiting ${delaySeconds}s..."
          }
          catch {
            $statusCode = $_.Exception.Response.StatusCode.value__
            if ($statusCode -and $statusCode -lt 500 -and $statusCode -ne 429) {
              Write-Error "VirusTotal API returned a non-retryable error ($statusCode): $($_.Exception.Message)"
              exit 1
            }
            Write-Host "Transient error checking VirusTotal status ($statusCode) — waiting ${delaySeconds}s before retry..."
          }

          Start-Sleep -Seconds $delaySeconds
        }

        if ([string]::IsNullOrWhiteSpace($sha256)) {
          Write-Error "VirusTotal report was not ready after $maxAttempts attempts."
          exit 1
        }

        $reportUrl = "https://www.virustotal.com/gui/file/$sha256/detection"
        "report_url=$reportUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Submit the launcher to VirusTotal
      if: steps.check_release.outputs.release_exists == 'false' && (steps.resolve_release.outputs.is_tag_release == 'true' || steps.finalize_branch_release.outputs.publish_now == 'true') && steps.optional_secrets.outputs.has_virustotal_key == 'true'
      id: virustotal_launcher
      continue-on-error: true
      env:
        VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      shell: pwsh
      run: |
        $filePath = Join-Path $env:GITHUB_WORKSPACE 'publish-output\MagicChatbox.exe'

        if (-not (Test-Path -LiteralPath $filePath)) {
          Write-Error "File not found: $filePath"
          exit 1
        }

        # Scanners score the extracted launcher, not the archive it arrived in, so the launcher
        # needs a report of its own. The GUI URL is derived from the hash, so there is nothing
        # to poll for — the link resolves once the analysis lands.
        $fileInfo = Get-Item $filePath
        $sha256 = (Get-FileHash -LiteralPath $filePath -Algorithm SHA256).Hash.ToLowerInvariant()

        try {
          Invoke-RestMethod `
            -Uri "https://www.virustotal.com/api/v3/files" `
            -Method Post `
            -Headers @{
              "x-apikey" = $env:VIRUSTOTAL_API_KEY
            } `
            -Form @{
              "file" = $fileInfo
            } `
            -TimeoutSec 120 | Out-Null
        }
        catch {
          Write-Host "::warning::Could not submit MagicChatbox.exe to VirusTotal: $($_.Exception.Message)"
        }

        "report_url=https://www.virustotal.com/gui/file/$sha256/detection" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    # ---- Publish ----
    - name: Determine the release type
      if: steps.check_release.outputs.release_exists == 'false' && (steps.resolve_release.outputs.is_tag_release == 'true' || steps.finalize_branch_release.outputs.publish_now == 'true')
      id: determine_release_type
      shell: pwsh
      run: |
        $isTagRelease = '${{ steps.resolve_release.outputs.is_tag_release }}' -eq 'true'

        if (-not $isTagRelease) {
          $isMasterRelease = $env:GITHUB_REF -eq 'refs/heads/master'
        } else {
          git fetch --no-tags origin master Pre-Master
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to fetch master/Pre-Master from origin."
            exit 1
          }

          $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tagCommit)) {
            Write-Error "Unable to resolve commit for tag $env:RELEASE_TAG."
            exit 1
          }

          git merge-base --is-ancestor $tagCommit origin/master
          $isMasterRelease = $LASTEXITCODE -eq 0
        }

        if ($isMasterRelease) {
          echo "PRE_RELEASE=false" | Out-File -Append -Encoding utf8 $Env:GITHUB_ENV
          echo "RELEASE_NAME=${{ steps.resolve_release.outputs.release_tag }}" | Out-File -Append -Encoding utf8 $Env:GITHUB_ENV
          "pre_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_name=${{ steps.resolve_release.outputs.release_tag }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        } else {
          if ($isTagRelease) {
            git merge-base --is-ancestor $tagCommit origin/Pre-Master
            $isPreMasterRelease = $LASTEXITCODE -eq 0
          } else {
            $isPreMasterRelease = $env:GITHUB_REF -eq 'refs/heads/Pre-Master'
          }

          if (-not $isPreMasterRelease) {
            Write-Warning "Tagged commit is not contained in master or Pre-Master. Defaulting to pre-release."
          }

          echo "PRE_RELEASE=true" | Out-File -Append -Encoding utf8 $Env:GITHUB_ENV
          echo "RELEASE_NAME=${{ steps.resolve_release.outputs.release_tag }} (pre-release)" | Out-File -Append -Encoding utf8 $Env:GITHUB_ENV
          "pre_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_name=${{ steps.resolve_release.outputs.release_tag }} (pre-release)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        }

    - name: Compose the release notes
      if: steps.check_release.outputs.release_exists == 'false' && (steps.resolve_release.outputs.is_tag_release == 'true' || steps.finalize_branch_release.outputs.publish_now == 'true')
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        APP_VERSION: ${{ env.VERSION }}
        RELEASE_TAG: ${{ steps.resolve_release.outputs.release_tag }}
        VIRUSTOTAL_URL: ${{ steps.virustotal_report.outputs.report_url }}
        VIRUSTOTAL_EXE_URL: ${{ steps.virustotal_launcher.outputs.report_url }}
        IS_PRERELEASE: ${{ steps.determine_release_type.outputs.pre_release }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const { execFileSync } = require('child_process');

          const NL = String.fromCharCode(10);
          const SEP = String.fromCharCode(31);

          const version = process.env.APP_VERSION;
          const tag = process.env.RELEASE_TAG;
          const vtUrl = process.env.VIRUSTOTAL_URL || '';
          const vtExeUrl = process.env.VIRUSTOTAL_EXE_URL || '';
          const isPrerelease = process.env.IS_PRERELEASE === 'true';
          const { owner, repo } = context.repo;
          const slug = owner + '/' + repo;
          const zipName = 'MagicChatbox-' + version + '.zip';
          const downloadUrl = 'https://github.com/' + slug + '/releases/download/' + tag + '/' + zipName;

          const git = (args) => execFileSync('git', args, { encoding: 'utf8' }).trim();

          let sha256 = '';
          try {
            const bytes = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, zipName));
            sha256 = crypto.createHash('sha256').update(bytes).digest('hex').toUpperCase();
          } catch (error) {
            core.warning('Could not hash ' + zipName + ': ' + error.message);
          }

          // A tag does not say whether it was a pre-release; the branch it came from does.
          // Ask the Releases API for the newest published release of the same kind, so that
          // pre-releases compare against pre-releases and full releases against full ones.
          let previousTag = '';
          try {
            const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
            const match = releases.data.find(
              (r) => !r.draft && r.tag_name !== tag && Boolean(r.prerelease) === isPrerelease
            );
            if (match) previousTag = match.tag_name;
          } catch (error) {
            core.warning('Could not list releases: ' + error.message);
          }

          if (!previousTag) {
            try {
              const tags = git(['tag', '--list', 'v*', '--sort=-v:refname']).split(NL).map((t) => t.trim());
              const here = tags.indexOf(tag);
              previousTag = here >= 0 ? tags[here + 1] || '' : tags[0] || '';
              if (previousTag) {
                core.warning('No previous ' + (isPrerelease ? 'pre-release' : 'release') +
                  ' found; comparing against the preceding tag ' + previousTag + ' instead.');
              }
            } catch (error) {
              previousTag = '';
            }
          }

          core.info('Comparing ' + (previousTag || '(no previous release)') + ' -> ' + tag +
            ' as a ' + (isPrerelease ? 'pre-release' : 'full release') + '.');

          let changelog = '';
          try {
            const range = previousTag ? previousTag + '..' + tag : tag;
            const raw = git(['log', range, '--no-merges', '--date-order',
              '--format=%h' + SEP + '%s' + SEP + '%an']);

            const skip = /^(chore\s*:\s*)?(bump|update)\s+version|^version update|^update version|^version bump|^package (updates?|downgrades?)$|^update FUNDING/i;
            const groups = [
              { key: 'feat', title: '### New', items: [] },
              { key: 'fix', title: '### Fixed', items: [] },
              { key: 'perf', title: '### Performance', items: [] },
              { key: 'other', title: '### Other changes', items: [] },
            ];
            const byKey = new Map(groups.map((g) => [g.key, g]));

            for (const line of raw.split(NL).filter(Boolean)) {
              const parts = line.split(SEP);
              const sha = parts[0];
              const subject = (parts[1] || '').trim();
              const author = parts[2] || '';
              if (!subject || skip.test(subject)) continue;

              const match = /^(\w+)(?:\(([^)]+)\))?!?:\s*(.+)$/.exec(subject);
              let key = 'other';
              let scope = '';
              let text = subject;

              if (match) {
                const type = match[1].toLowerCase();
                if (byKey.has(type) && type !== 'other') key = type;
                scope = match[2] || '';
                text = match[3];
              }

              const link = '[`' + sha + '`](https://github.com/' + slug + '/commit/' + sha + ')';
              const who = author && author !== owner ? ' by **' + author + '**' : '';
              const prefix = scope ? '**' + scope + '** — ' : '';
              byKey.get(key).items.push('- ' + prefix + text + who + ' (' + link + ')');
            }

            const sections = groups
              .filter((g) => g.items.length)
              .map((g) => g.title + NL + NL + g.items.join(NL));

            if (sections.length) {
              changelog = sections.join(NL + NL + '<br>' + NL + NL);
              if (previousTag) {
                changelog += NL + NL + '<br>' + NL + NL + '**Full changelog:** [`' + previousTag +
                  '` → `' + tag + '`](https://github.com/' + slug + '/compare/' +
                  previousTag + '...' + tag + ')';
              }
            }
          } catch (error) {
            core.warning('Could not build the changelog: ' + error.message);
          }

          if (!changelog) {
            changelog = 'See the [commit history](https://github.com/' + slug + '/commits/' + tag +
              ') for what changed.';
          }

          const badge = (label, color, logo) =>
            'https://custom-icon-badges.demolab.com/badge/-' + label + '-' + color +
            '?style=for-the-badge&logo=' + logo + '&logoColor=white';

          const scanBadge = vtUrl
            ? NL + '<a href="' + vtUrl + '"><img src="' + badge('VirusTotal%20scan', '1E5AA8', 'virustotal') +
              '" alt="VirusTotal scan"></a>'
            : '';

          const kindNote = isPrerelease
            ? NL + NL + '> [!NOTE]  ' + NL +
              '> This is a **pre-release**. It is newer than the last stable build and may still have rough edges. The changes listed below are since the previous pre-release.'
            : '';

          const verifySection = sha256
            ? [
                '- SHA-256 of `' + zipName + '`:',
                '',
                '  ```',
                '  ' + sha256,
                '  ```',
                '',
                '<br>',
                '',
                '- Compare it against your download in PowerShell:',
                '',
                '  ```powershell',
                '  Get-FileHash ./' + zipName + ' -Algorithm SHA256',
                '  ```',
              ].join(NL)
            : '- A checksum could not be generated for this build.';

          const body = `<div align="center">

          <h1>MagicChatbox v${version}</h1>

          <a href="${downloadUrl}"><img src="${badge('Download%20for%20Windows', '512BD4', 'download')}" alt="Download"></a>${scanBadge}

          <img src="https://img.shields.io/github/downloads/${slug}/${tag}/total?color=AB3BFF&label=downloads%20of%20this%20version&style=flat-square" alt="Downloads of this version">

          </div>${kindNote}

          <br>

          ---

          ## \`What's new\`

          ${changelog}

          <br>

          ---

          ## \`Installing this version\`

            1. **Download** \`${zipName}\` from the link above.
            2. **[.NET 10 Desktop Runtime](https://dotnet.microsoft.com/en-us/download/dotnet/10.0)** — free, from Microsoft. On that page pick **Desktop Runtime → Windows x64**; the plain ".NET Runtime" is not enough. Install it before step 4 or MagicChatbox will not start.
            3. **Extract the ZIP into a folder of its own.** Do not run it from inside the ZIP — the app needs to write its files next to itself.
            4. Run **MagicChatbox.exe**.

          <br>

          > [!TIP]${'  '}
          > Updates replace the files in place, so extracting over your existing folder keeps all of your settings.

          <br>

          > [!IMPORTANT]${'  '}
          > **Please read the [Terms of Service](https://github.com/${slug}/blob/master/Security.md) before you download or use MagicChatbox.** It does not take long, and it covers how your privacy is handled as well as the rules for using the software.

          <br>

          ---

          ## \`Windows says it is dangerous\`

          - MagicChatbox is not signed with a Microsoft certificate, so SmartScreen warns about it — as it does for any unsigned app. Click **More info → Run anyway**.

          <br>

          - Some antivirus engines report a false positive. MagicChatbox is not a RAT, a Trojan or spyware. Every release is scanned with VirusTotal before it is published${vtUrl ? ', and the report is linked at the top of this page' : ''}.${vtExeUrl ? ' `MagicChatbox.exe` is [scanned separately](' + vtExeUrl + '), because scanners judge the extracted launcher rather than the archive.' : ''} The [full source](https://github.com/${slug}) is published for anyone to read.

          <br>

          > [!CAUTION]${'  '}
          > Only download from the [official Releases page](https://github.com/${slug}/releases). Forks and re-uploads are not supervised by us and we cannot vouch for them.

          <br>

          ---

          ## \`Verifying your download\`

          ${verifySection}

          <br>

          ---

          ## \`How do I get help?\`

          - You can find help in our [Discord Server](https://discord.gg/ZaSFwBfhvG) by creating a ticket. Include your app version and the newest log file.

          <br>

          - There is a guide for nearly everything in the [wiki](https://github.com/${slug}/wiki), common questions in the [FAQ](https://github.com/${slug}/wiki/Frequently-Asked-Questions), and fixes in [Troubleshooting](https://github.com/${slug}/wiki/Troubleshooting).

          <br>

          - Found a bug? [Open an issue](https://github.com/${slug}/issues).

          <br>

          ---
          `;

          fs.writeFileSync(path.join(process.env.GITHUB_WORKSPACE, 'release-notes.md'), body);
          core.summary.addRaw(body).write();

    - name: Publish the GitHub release
      if: steps.check_release.outputs.release_exists == 'false' && (steps.resolve_release.outputs.is_tag_release == 'true' || steps.finalize_branch_release.outputs.publish_now == 'true')
      id: create_release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      env:
        GITHUB_TOKEN: ${{ secrets.MY_PAT }}
      with:
        tag_name: ${{ steps.resolve_release.outputs.release_tag }}
        name: ${{ steps.determine_release_type.outputs.release_name }}
        draft: false
        prerelease: ${{ steps.determine_release_type.outputs.pre_release }}
        files: ./MagicChatbox-${{ env.VERSION }}.zip
        body_path: ${{ github.workspace }}/release-notes.md
